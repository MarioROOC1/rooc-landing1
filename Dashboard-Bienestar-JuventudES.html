ap;\n}\n\n:root {\n  /* ===== Brand color palette (from official PDF) ===== */\n  --rooc-slate:        #577C8E; /* wordmark / neutral primary  RGB 87 124 142 */\n  --rooc-burgundy:     #83344A; /* accent — earnest / human    RGB 131 52 74 */\n  --rooc-blue-light:   #81ADD2; /* light pebble — secondary    RGB 129 173 210 */\n  --rooc-blue:         #2B7CA4; /* mid pebble — anchor blue    RGB 43 124 164 */\n  --rooc-blue-bright:  #0096D1; /* primary action / link       RGB 0 150 209 */\n  --rooc-teal:         #3EBDC6; /* energy / supporting         RGB 62 189 198 */\n  --rooc-yellow:       #F6D60F; /* highlight / spark           RGB 246 214 15 */\n  --rooc-cream:        #F4EFEB; /* warm off-white surface      RGB 244 239 235 */\n\n  /* ===== Tonal extensions (derived, oklch) ===== */\n  --rooc-slate-50:   oklch(from var(--rooc-slate)   97% c h);\n  --rooc-slate-100:  oklch(from var(--rooc-slate)   93% c h);\n  --rooc-slate-200:  oklch(from var(--rooc-slate)   86% c h);\n  --rooc-slate-300:  oklch(from var(--rooc-slate)   76% c h);\n  --rooc-slate-500:  var(--rooc-slate);\n  --rooc-slate-700:  oklch(from var(--rooc-slate)   42% c h);\n  --rooc-slate-900:  oklch(from var(--rooc-slate)   24% c h);\n\n  --rooc-blue-50:    oklch(from var(--rooc-blue)    97% c h);\n  --rooc-blue-100:   oklch(from var(--rooc-blue)    93% c h);\n  --rooc-blue-200:   oklch(from var(--rooc-blue)    86% c h);\n  --rooc-blue-300:   var(--rooc-blue-light);\n  --rooc-blue-500:   var(--rooc-blue);\n  --rooc-blue-600:   var(--rooc-blue-bright);\n  --rooc-blue-700:   oklch(from var(--rooc-blue)    35% c h);\n  --rooc-blue-900:   oklch(from var(--rooc-blue)    20% c h);\n\n  /* ===== Semantic surfaces ===== */\n  --bg:              #FFFFFF;\n  --bg-soft:         var(--rooc-cream);          /* warm panel */\n  --bg-muted:        var(--rooc-slate-50);\n  --bg-inverse:      var(--rooc-slate-900);\n  --bg-brand:        var(--rooc-blue);\n  --bg-brand-soft:   var(--rooc-blue-50);\n\n  /* ===== Foreground / text ===== */\n  --fg:              #2A3942;                    /* near-slate, near-black */\n  --fg-muted:        var(--rooc-slate);          /* the wordmark gray-blue */\n  --fg-subtle:       var(--rooc-slate-300);\n  --fg-inverse:      #FFFFFF;\n  --fg-on-brand:     #FFFFFF;\n  --fg-link:         var(--rooc-blue-bright);\n  --fg-link-hover:   var(--rooc-blue);\n\n  /* ===== Borders & dividers ===== */\n  --border:          oklch(from var(--rooc-slate) 90% c h);\n  --border-strong:   oklch(from var(--rooc-slate) 78% c h);\n  --border-focus:    var(--rooc-blue-bright);\n\n  /* ===== Status (semantic, drawn from palette, calmer than the brand spark) ===== */\n  --status-info:     var(--rooc-blue);          /* anchor blue, not bright */\n  --status-success:  #5B9F73;                   /* sage — harmonised with palette */\n  --status-warn:     #B8893A;                   /* deep mustard, derived from yellow */\n  --status-error:    var(--rooc-burgundy);\n\n  /* ===== Typography =====\n     If you have the licensed Avenir Next Arabic files,\n     replace 'Manrope' below with 'Avenir Next Arabic'. */\n  --font-display:    'League Spartan', 'Quicksand', system-ui, sans-serif;\n  --font-sans:       'Avenir Next Arabic', 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;\n  --font-mono:       'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* Scale — modular, 1.250 (major third) anchored at 16 */\n  --text-xs:    12px;\n  --text-sm:    14px;\n  --text-base:  16px;\n  --text-md:    18px;\n  --text-lg:    20px;\n  --text-xl:    24px;\n  --text-2xl:   30px;\n  --text-3xl:   38px;\n  --text-4xl:   48px;\n  --text-5xl:   60px;\n  --text-6xl:   76px;\n\n  /* Weights — League Spartan reads heavy; the wordmark sits at 300 */\n  --fw-light:    300;            /* @kind font */\n  --fw-regular:  400;            /* @kind font */\n  --fw-medium:   500;            /* @kind font */\n  --fw-semibold: 600;            /* @kind font */\n  --fw-bold:     700;            /* @kind font */\n\n  /* Line heights */\n  --lh-tight:   1.1;             /* @kind font */\n  --lh-snug:    1.25;            /* @kind font */\n  --lh-normal:  1.5;             /* @kind font */\n  --lh-relaxed: 1.7;             /* @kind font */\n\n  /* Letter spacing — League Spartan is geometric; tighten at display */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n  --tracking-wider:  0.06em;       /* eyebrows / uppercase labels */\n\n  /* ===== Spacing — 4px base ===== */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ===== Radius — generous, echoing the pebble forms ===== */\n  --radius-xs:    4px;\n  --radius-sm:    8px;\n  --radius-md:    12px;\n  --radius-lg:    20px;\n  --radius-xl:    32px;\n  --radius-pill:  999px;\n  --radius-blob:  68% 32% 58% 42% / 56% 44% 56% 44%;  /* the pebble itself */\n\n  /* ===== Elevation — soft, never harsh. Slate-tinted. ===== */\n  --shadow-xs:  0 1px 2px 0 oklch(from var(--rooc-slate) 30% c h / 0.06);\n  --shadow-sm:  0 2px 6px -1px oklch(from var(--rooc-slate) 30% c h / 0.08),\n                0 1px 2px 0 oklch(from var(--rooc-slate) 30% c h / 0.04);\n  --shadow-md:  0 8px 20px -6px oklch(from var(--rooc-slate) 30% c h / 0.12),\n                0 2px 6px -2px oklch(from var(--rooc-slate) 30% c h / 0.06);\n  --shadow-lg:  0 24px 48px -12px oklch(from var(--rooc-slate) 30% c h / 0.18),\n                0 4px 12px -4px oklch(from var(--rooc-slate) 30% c h / 0.08);\n  --shadow-focus: 0 0 0 3px oklch(from var(--rooc-blue-bright) 70% c h / 0.35);\n\n  /* ===== Motion ===== */\n  --ease-out:      cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */\n  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */\n  --duration-fast: 120ms;        /* @kind other */\n  --duration-med:  220ms;        /* @kind other */\n  --duration-slow: 420ms;        /* @kind other */\n}\n\n/* ============================================================\n   Semantic element styles — drop colors_and_type.css in and\n   most prose looks correct without further work.\n   ============================================================ */\nhtml { font-family: var(--font-sans); color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }\nbody { margin: 0; font-size: var(--text-base); line-height: var(--lh-normal); }\n\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);   /* ROOC uses League Spartan Regular, never Light */\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n  margin: 0 0 0.5em;\n  text-wrap: balance;\n}\nh1 { font-size: var(--text-5xl); line-height: var(--lh-tight); font-weight: var(--fw-regular); letter-spacing: -0.015em; }\nh2 { font-size: var(--text-3xl); line-height: var(--lh-tight); font-weight: var(--fw-regular); }\nh3 { font-size: var(--text-2xl); line-height: var(--lh-snug); font-weight: var(--fw-regular); }\nh4 { font-size: var(--text-xl);  line-height: var(--lh-snug); font-weight: var(--fw-medium); }\nh5 { font-size: var(--text-lg);  line-height: var(--lh-snug); font-weight: var(--fw-medium); }\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n\np  { margin: 0 0 1em; max-width: 68ch; line-height: var(--lh-relaxed); text-wrap: pretty; }\n.lead { font-size: var(--text-lg); color: var(--fg); line-height: var(--lh-relaxed); }\nsmall { font-size: var(--text-sm); color: var(--fg-muted); }\n\na { color: var(--fg-link); text-decoration: none; border-bottom: 1px solid transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }\na:hover { color: var(--fg-link-hover); border-bottom-color: currentColor; }\n\ncode, pre, kbd { font-family: var(--font-mono); font-size: 0.92em; }\ncode { background: var(--bg-muted); padding: 0.1em 0.35em; border-radius: var(--radius-xs); }\n\nhr { border: 0; border-top: 1px solid var(--border); margin: var(--space-8) 0; }\n\n::selection { background: oklch(from var(--rooc-blue-bright) 80% c h / 0.4); color: var(--fg); }\n<\u002Fstyle>\n<style>/* ============================================================\n   ROOC — Design System entry point\n   Consumers: link THIS file. It pulls in the canonical token\n   set + base element styles from colors_and_type.css.\n   ============================================================ */\n/* ============================================================\n   ROOC — Return On Organizational Culture\n   Design tokens: colors, typography, spacing, radius, shadow\n   Source of truth: ROOC Paleta de colores.pdf + brand assets\n   ============================================================ */\n\n/* ---- Webfonts ----------------------------------------------\n   ROOC's official type system:\n     - DISPLAY  → League Spartan        (free, loaded from Google Fonts)\n     - BODY/UI  → Avenir Next Arabic    (paid Linotype — NOT free)\n   Because Avenir Next Arabic is not redistributable, this\n   stylesheet loads MANROPE as the in-code substitute. Manrope\n   is the closest free geometric humanist sans to Avenir Next.\n   FLAGGED → drop the licensed Avenir Next Arabic .woff2 files\n   into /fonts and replace --font-sans below.\n   ------------------------------------------------------------ */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"579d250e-be08-4847-8843-138ca3cc4712\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBra ly: this @font-face sources it from the user's locally-installed copy via\n   local(). Anyone without it installed falls through to the Manrope stack in\n   --font-sans. When the licensed .woff2 files are uploaded to /fonts, add url()\n   src entries here. */\n@font-face {\n  font-family: 'Avenir Next Arabic';\n  src: local('Avenir Next Arabic'), local('AvenirNextArabic'), local('Avenir Next'), local('AvenirNext');\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ===== Brand color palette (from official PDF) ===== */\n  --rooc-slate:        #577C8E; /* wordmark / neutral primary  RGB 87 124 142 */\n  --rooc-burgundy:     #83344A; /* accent — earnest / human    RGB 131 52 74 */\n  --rooc-blue-light:   #81ADD2; /* light pebble — secondary    RGB 129 173 210 */\n  --rooc-blue:         #2B7CA4; /* mid pebble — anchor blue    RGB 43 124 164 */\n  --rooc-blue-bright:  #0096D1; /* primary action / link       RGB 0 150 209 */\n  --rooc-teal:         #3EBDC6; /* energy / supporting         RGB 62 189 198 */\n  --rooc-yellow:       #F6D60F; /* highlight / spark           RGB 246 214 15 */\n  --rooc-cream:        #F4EFEB; /* warm off-white surface      RGB 244 239 235 */\n\n  /* ===== Tonal extensions (derived, oklch) ===== */\n  --rooc-slate-50:   oklch(from var(--rooc-slate)   97% c h);\n  --rooc-slate-100:  oklch(from var(--rooc-slate)   93% c h);\n  --rooc-slate-200:  oklch(from var(--rooc-slate)   86% c h);\n  --rooc-slate-300:  oklch(from var(--rooc-slate)   76% c h);\n  --rooc-slate-500:  var(--rooc-slate);\n  --rooc-slate-700:  oklch(from var(--rooc-slate)   42% c h);\n  --rooc-slate-900:  oklch(from var(--rooc-slate)   24% c h);\n\n  --rooc-blue-50:    oklch(from var(--rooc-blue)    97% c h);\n  --rooc-blue-100:   oklch(from var(--rooc-blue)    93% c h);\n  --rooc-blue-200:   oklch(from var(--rooc-blue)    86% c h);\n  --rooc-blue-300:   var(--rooc-blue-light);\n  --rooc-blue-500:   var(--rooc-blue);\n  --rooc-blue-600:   var(--rooc-blue-bright);\n  --rooc-blue-700:   oklch(from var(--rooc-blue)    35% c h);\n  --rooc-blue-900:   oklch(from var(--rooc-blue)    20% c h);\n\n  /* ===== Semantic surfaces ===== */\n  --bg:              #FFFFFF;\n  --bg-soft:         var(--rooc-cream);          /* warm panel */\n  --bg-muted:        var(--rooc-slate-50);\n  --bg-inverse:      var(--rooc-slate-900);\n  --bg-brand:        var(--rooc-blue);\n  --bg-brand-soft:   var(--rooc-blue-50);\n\n  /* ===== Foreground / text ===== */\n  --fg:              #2A3942;                    /* near-slate, near-black */\n  --fg-muted:        var(--rooc-slate);          /* the wordmark gray-blue */\n  --fg-subtle:       var(--rooc-slate-300);\n  --fg-inverse:      #FFFFFF;\n  --fg-on-brand:     #FFFFFF;\n  --fg-link:         var(--rooc-blue-bright);\n  --fg-link-hover:   var(--rooc-blue);\n\n  /* ===== Borders & dividers ===== */\n  --border:          oklch(from var(--rooc-slate) 90% c h);\n  --border-strong:   oklch(from var(--rooc-slate) 78% c h);\n  --border-focus:    var(--rooc-blue-bright);\n\n  /* ===== Status (semantic, drawn from palette, calmer than the brand spark) ===== */\n  --status-info:     var(--rooc-blue);          /* anchor blue, not bright */\n  --status-success:  #5B9F73;                   /* sage — harmonised with palette */\n  --status-warn:     #B8893A;                   /* deep mustard, derived from yellow */\n  --status-error:    var(--rooc-burgundy);\n\n  /* ===== Typography =====\n     If you have the licensed Avenir Next Arabic files,\n     replace 'Manrope' below with 'Avenir Next Arabic'. */\n  --font-display:    'League Spartan', 'Quicksand', system-ui, sans-serif;\n  --font-sans:       'Avenir Next Arabic', 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;\n  --font-mono:       'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;\n\n  /* Scale — modular, 1.250 (major third) anchored at 16 */\n  --text-xs:    12px;\n  --text-sm:    14px;\n  --text-base:  16px;\n  --text-md:    18px;\n  --text-lg:    20px;\n  --text-xl:    24px;\n  --text-2xl:   30px;\n  --text-3xl:   38px;\n  --text-4xl:   48px;\n  --text-5xl:   60px;\n  --text-6xl:   76px;\n\n  /* Weights — League Spartan reads heavy; the wordmark sits at 300 */\n  --fw-light:    300;            /* @kind font */\n  --fw-regular:  400;            /* @kind font */\n  --fw-medium:   500;            /* @kind font */\n  --fw-semibold: 600;            /* @kind font */\n  --fw-bold:     700;            /* @kind font */\n\n  /* Line heights */\n  --lh-tight:   1.1;             /* @kind font */\n  --lh-snug:    1.25;            /* @kind font */\n  --lh-normal:  1.5;             /* @kind font */\n  --lh-relaxed: 1.7;             /* @kind font */\n\n  /* Letter spacing — League Spartan is geometric; tighten at display */\n  --tracking-tight:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:   0.02em;\n  --tracking-wider:  0.06em;       /* eyebrows / uppercase labels */\n\n  /* ===== Spacing — 4px base ===== */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ===== Radius — generous, echoing the pebble forms ===== */\n  --radius-xs:    4px;\n  --radius-sm:    8px;\n  --radius-md:    12px;\n  --radius-lg:    20px;\n  --radius-xl:    32px;\n  --radius-pill:  999px;\n  --radius-blob:  68% 32% 58% 42% / 56% 44% 56% 44%;  /* the pebble itself */\n\n  /* ===== Elevation — soft, never harsh. Slate-tinted. ===== */\n  --shadow-xs:  0 1px 2px 0 oklch(from var(--rooc-slate) 30% c h / 0.06);\n  --shadow-sm:  0 2px 6px -1px oklch(from var(--rooc-slate) 30% c h / 0.08),\n                0 1px 2px 0 oklch(from var(--rooc-slate) 30% c h / 0.04);\n  --shadow-md:  0 8px 20px -6px oklch(from var(--rooc-slate) 30% c h / 0.12),\n                0 2px 6px -2px oklch(from var(--rooc-slate) 30% c h / 0.06);\n  --shadow-lg:  0 24px 48px -12px oklch(from var(--rooc-slate) 30% c h / 0.18),\n                0 4px 12px -4px oklch(from var(--rooc-slate) 30% c h / 0.08);\n  --shadow-focus: 0 0 0 3px oklch(from var(--rooc-blue-bright) 70% c h / 0.35);\n\n  /* ===== Motion ===== */\n  --ease-out:      cubic-bezier(0.22, 1, 0.36, 1);   /* @kind other */\n  --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);   /* @kind other */\n  --duration-fast: 120ms;        /* @kind other */\n  --duration-med:  220ms;        /* @kind other */\n  --duration-slow: 420ms;        /* @kind other */\n}\n\n/* ============================================================\n   Semantic element styles — drop colors_and_type.css in and\n   most prose looks correct without further work.\n   ============================================================ */\nhtml { font-family: var(--font-sans); color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }\nbody { margin: 0; font-size: var(--text-base); line-height: var(--lh-normal); }\n\nh1, h2, h3, h4, h5 {\n  font-family: var(--font-display);\n  font-weight: var(--fw-regular);   /* ROOC uses League Spartan Regular, never Light */\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg);\n  margin: 0 0 0.5em;\n  text-wrap: balance;\n}\nh1 { font-size: var(--text-5xl); line-height: var(--lh-tight); font-weight: var(--fw-regular); letter-spacing: -0.015em; }\nh2 { font-size: var(--text-3xl); line-height: var(--lh-tight); font-weight: var(--fw-regular); }\nh3 { font-size: var(--text-2xl); line-height: var(--lh-snug); font-weight: var(--fw-regular); }\nh4 { font-size: var(--text-xl);  line-height: var(--lh-snug); font-weight: var(--fw-medium); }\nh5 { font-size: var(--text-lg);  line-height: var(--lh-snug); font-weight: var(--fw-medium); }\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--tracking-wider);\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n\np  { margin: 0 0 1em; max-width: 68ch; line-height: var(--lh-relaxed); text-wrap: pretty; }\n.lead { font-size: var(--text-lg); color: var(--fg); line-height: var(--lh-relaxed); }\nsmall { font-size: var(--text-sm); color: var(--fg-muted); }\n\na { color: var(--fg-link); text-decoration: none; border-bottom: 1px solid transparent; transition: color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out); }\na:hover { color: var(--fg-link-hover); border-bottom-color: currentColor; }\n\ncode, pre, kbd { font-family: var(--font-mono); font-size: 0.92em; }\ncode { background: var(--bg-muted); padding: 0.1em 0.35em; border-radius: var(--radius-xs); }\n\nhr { border: 0; border-top: 1px solid var(--border); margin: var(--space-8) 0; }\n\n::selection { background: oklch(from var(--rooc-blue-bright) 80% c h / 0.4); color: var(--fg); }\n\n<\u002Fstyle>\n<script src=\"9f4e23f4-c841-4d18-885a-0ada97e69be0\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'League Spartan';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d02bac9b-3554-4d92-99a2-73a5399c2a82\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'League Spartan';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9a06132f-ad37-42eb-b2de-b9b32b4fe9ff\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'League Spa pretty;\">Lectura de fatiga por compasión y estrés traumático secundario en promotores juveniles, sobre el marco Satisfacción por compasión / Burnout / STS.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 10px; text-align: right; font-size: 13px; color: var(--rooc-slate);\">\n      <img src=\"9f1e4b39-c71e-49d1-a86a-57d84d9d2ef2\" alt=\"ROOC — Return On Organizational Culture\" style=\"height: 109px; width: 109px; display: block; margin-bottom: auto\">\n      <div><span style=\"font-family: var(--font-display); font-size: 30px; color: var(--rooc-blue); letter-spacing: -0.01em;\">16<\u002Fspan> respuestas<\u002Fdiv>\n      <div>Google Forms · agosto 2026<\u002Fdiv><div><br><\u002Fdiv>\n      \n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"margin-top: 40px; background: var(--rooc-blue); border-radius: 20px; padding: 40px 44px; display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 56px; align-items: start;\">\n    <div>\n      <p style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.72); margin: 0 0 16px;\">Hallazgo central<\u002Fp>\n      <h2 style=\"font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.15; letter-spacing: -0.015em; color: #FFFFFF; margin: 0 0 18px;\">El desgaste del equipo se relaciona con la capa organizacional, no con la carga emocional que generan los casos.<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.6; color: rgba(255,255,255,0.88); margin: 0; max-width: 46ch; text-wrap: pretty;\">Liderazgo y dinámicas de equipo empatan como factor #1 con 9 de 16 menciones cada uno, muy por encima de las problemáticas complejas de las personas jóvenes (2 de 16). Una capacitación centrada solo en regulación emocional individual no toca la causa principal.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: rgba(255,255,255,0.10); border-radius: 16px; padding: 28px 30px;\">\n      <p style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.72); margin: 0 0 22px;\">Situaciones que más desgastan · menciones de 16<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 1fr 34px; gap: 12px 16px; align-items: center; font-size: 14px; color: #FFFFFF;\">\n        <div>Relación o comunicación con liderazgo / coordinación<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 100%; height: 100%; border-radius: 999px; background: var(--rooc-yellow);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">9<\u002Fdiv>\n\n        <div>Dinámicas o relación con el equipo de compañeros<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 100%; height: 100%; border-radius: 999px; background: var(--rooc-yellow);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">9<\u002Fdiv>\n\n        <div>Presión por alcanzar resultados o metas<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 88.9%; height: 100%; border-radius: 999px; background-color: var(--rooc-yellow)\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">8<\u002Fdiv>\n\n        <div>Cambio constante entre roles (multitarea)<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 55.6%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">5<\u002Fdiv>\n\n        <div>Carga de trabajo y volumen de tareas<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 22.2%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">2<\u002Fdiv>\n\n        <div>Falta de tiempo en la jornada para pausas<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 22.2%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">2<\u002Fdiv>\n\n        <div>Problemáticas complejas de las personas jóvenes<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: rgba(255,255,255,0.16);\"><div style=\"width: 22.2%; height: 100%; border-radius: 999px; background-color: var(--rooc-teal)\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right;\">2<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top: 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px;\">\n    <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 26px 24px; display: flex; flex-direction: column; gap: 10px;\">\n      <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rooc-teal); margin: 0;\">Protector<\u002Fp>\n      <div style=\"font-family: var(--font-display); font-size: 44px; line-height: 1; letter-spacing: -0.015em; color: var(--rooc-blue-700);\">4.06<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.45; color: var(--fg); margin: 0; font-weight: 600;\">Gratificación y propósito al ver avances de los jóvenes<\u002Fp>\n      <p style=\"font-size: 12px; color: var(--rooc-slate); margin: 0;\">La media más alta de la encuesta · escala 1–5<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 26px 24px; display: flex; flex-direction: column; gap: 10px;\">\n      <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--status-warn); margin: 0;\">Burnout<\u002Fp>\n      <div style=\"font-family: var(--font-display); font-size: 44px; line-height: 1; letter-spacing: -0.015em; color: var(--rooc-blue-700);\">3.38<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.45; color: var(--fg); margin: 0; font-weight: 600;\">Fatiga física: dolores, tensión, sueño alterado<\u002Fp>\n      <p style=\"font-size: 12px; color: var(--rooc-slate); margin: 0;\">La más alta entre las variables de desgaste<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 26px 24px; display: flex; flex-direction: column; gap: 10px;\">\n      <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--status-warn); margin: 0;\">Estrés traumático secundario<\u002Fp>\n      <div style=\"font-family: var(--font-display); font-size: 44px; line-height: 1; letter-spacing: -0.015em; color: var(--rooc-blue-700);\">3.06<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.45; color: var(--fg); margin: 0; font-weight: 600;\">Piensan en los jóvenes fuera del horario laboral<\u002Fp>\n      <p style=\"font-size: 12px; color: var(--rooc-slate); margin: 0;\">Intrusión cognitiva<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 26px 24px; display: flex; flex-direction: column; gap: 10px; background: var(--rooc-blue-50);\">\n      <p style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rooc-teal); margin: 0;\">Contenido<\u002Fp>\n oc-slate-100);\"><div style=\"width: 42.9%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right; color: var(--rooc-blue);\">3<\u002Fdiv>\n\n        <div>Culpa al intentar tomar un descanso o desconectarse<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 42.9%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right; color: var(--rooc-blue);\">3<\u002Fdiv>\n\n        <div>No contar con herramientas o técnicas claras<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 42.9%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right; color: var(--rooc-blue);\">3<\u002Fdiv>\n\n        <div style=\"color: var(--rooc-slate);\">No me cuesta trabajo regularme<\u002Fdiv>\n        <div style=\"height: 12px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 71.4%; height: 100%; border-radius: 999px; background: var(--rooc-slate-200);\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family: var(--font-display); font-size: 18px; text-align: right; color: var(--rooc-slate);\">5<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ verDetalle }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"margin-top: 56px;\">\n    <p style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rooc-slate); margin: 0 0 10px;\">Contexto del desgaste<\u002Fp>\n    <h2 style=\"font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: -0.015em; margin: 0 0 24px; color: var(--rooc-blue-700);\">Emociones, roles y contenido de los casos<\u002Fh2>\n\n    <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start;\">\n      <div style=\"display: grid; gap: 20px;\">\n      <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 28px 30px;\">\n        <p style=\"font-size: 13px; font-weight: 600; margin: 0 0 6px;\">Emociones con las que se identifican hoy<\u002Fp>\n        <p style=\"font-size: 12px; color: var(--rooc-slate); margin: 0 0 22px;\">Respuesta múltiple · menciones de 16<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 90px 24px; gap: 12px 14px; align-items: center; font-size: 14px;\">\n          <div style=\"font-weight: 600;\">Cansancio o agotamiento<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 100%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">9<\u002Fdiv>\n\n          <div style=\"font-weight: 600;\">Satisfacción u orgullo<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 100%; height: 100%; border-radius: 999px; background: var(--rooc-teal);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">9<\u002Fdiv>\n\n          <div>Entusiasmo o motivación<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 55.6%; height: 100%; border-radius: 999px; background: var(--rooc-teal);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">5<\u002Fdiv>\n\n          <div>Tranquilidad o estabilidad<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 44.4%; height: 100%; border-radius: 999px; background: var(--rooc-teal);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">4<\u002Fdiv>\n\n          <div>Culpa<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 44.4%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">4<\u002Fdiv>\n\n          <div>Frustración o impotencia<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 44.4%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">4<\u002Fdiv>\n\n          <div>Apatía o desconexión<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 33.3%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">3<\u002Fdiv>\n\n          <div>Preocupación o ansiedad<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 22.2%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">2<\u002Fdiv>\n\n          <div>Sobrecarga o abrumación<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 22.2%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">2<\u002Fdiv>\n\n          <div>Conformismo<\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 11.1%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">1<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 1.6; color: var(--fg-muted); margin: 22px 0 0;\">Cansancio y orgullo coexisten en la misma medida: nos lleva a pensar que es un tema de sobrecarga o saber poner límites.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 28px 30px;\">\n        <p style=\"font-size: 13px; font-weight: 600; margin: 0 0 6px;\">Rol que más afecta su bienestar<\u002Fp>\n        <p style=\"font-size: 12px; color: var(--rooc-slate); margin: 0 0 22px;\">Respuesta única · 16 personas<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 24px; gap: 14px 14px; align-items: center; font-size: 14px;\">\n          <div>\n            <div style=\"margin-bottom: 8px;\">Facilitación de talleres y espacios grupales<\u002Fdiv>\n            <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 100%; height: 100%; border-radius: 999px; background: var(--rooc-blue);\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">5<\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Reclutamiento y convocatoria<\u002Fdiv>\n            <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 100%; height: 100%; border-radius: 999px; background: var(--rooc-blue);\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">5<\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Consejería y acompañamiento individual<\u002Fdiv>\n            <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 60%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">3<\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Promotoría de paz<\u002Fdiv>\n            <div style=\"height: 10px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 60%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family: var(--font-display); font-size: 17px; text-align: right;\">3<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 1.6; color: var(--fg-muted); margin: 24px 0 0;\">Ningún rol destaca como el más desgastante. Refuerza que el problema es sistémico y no de una función específica.<\u002Fp>\n      <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 28px 30px;\">\n        <p style=\"font-size: 13px; font-weight: 600; margin: 0 0 6px;\">Problemáticas: frecuencia vs. impacto<\u002Fp>\n        <p style=\"font-size: 12px; color: var(--rooc-slate); margin: 0 0 14px;\">Respuesta múltiple · menciones de 16<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 11px; color: var(--rooc-slate); margin: 0 0 20px;\">\n          <div style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"flex: 0 0 18px; width: 18px; height: 8px; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fspan>Impacto emocional en ellos<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"flex: 0 0 18px; width: 18px; height: 8px; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fspan>Frecuencia con que la escuchan<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; gap: 18px; font-size: 14px;\">\n          <div>\n            <div style=\"margin-bottom: 8px;\">Desempleo, falta de oportunidades o pobreza<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 6.3%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">1<\u002Fdiv>\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 62.5%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right; color: var(--rooc-slate);\">10<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px; font-weight: 600;\">Ideación suicida, depresión o salud mental grave<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 50%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">8<\u002Fdiv>\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 62.5%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right; color: var(--rooc-slate);\">10<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Falta de red de apoyo o abandono familiar<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 25%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">4<\u002Fdiv>\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 62.5%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right; color: var(--rooc-slate);\">10<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Consumo de sustancias o adicciones<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 18.8%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">3<\u002Fdiv>\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 31.3%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right; color: var(--rooc-slate);\">5<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Violencia intrafamiliar o de género<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 18.8%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">3<\u002Fdiv>\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 18.8%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right; color: var(--rooc-slate);\">3<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"margin-bottom: 8px;\">Inseguridad o violencia comunitaria<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 12.5%; height: 100%; border-radius: 999px; background: var(--rooc-burgundy);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">2<\u002Fdiv>\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 12.5%; height: 100%; border-radius: 999px; background: var(--rooc-blue-light);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right; color: var(--rooc-slate);\">2<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"color: var(--rooc-slate);\">\n            <div style=\"margin-bottom: 8px;\">Ninguna en particular (solo impacto)<\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 20px; gap: 5px 10px; align-items: center;\">\n              <div style=\"height: 9px; border-radius: 999px; background: var(--rooc-slate-100);\"><div style=\"width: 31.3%; height: 100%; border-radius: 999px; background: var(--rooc-slate-200);\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"font-family: var(--font-display); font-size: 15px; text-align: right;\">5<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 1.6; color: var(--fg-muted); margin: 24px 0 0;\">Desempleo, salud mental grave y falta de red de apoyo se escuchan por igual (10 menciones cada una), pero solo la salud mental grave concentra el impacto emocional: 8 de 16. El desempleo se escucha tanto como ella y casi no pesa.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ verVerbatims }}\" hint-placeholder-val=\"{{ true }}\">\n  <section style=\"margin-top: 56px; background: #FFFFFF; border-radius: 20px; padding: 40px 44px;\">\n    <p style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rooc-burgundy); margin: 0 0 10px;\">EN SUS PALABRAS - CITAS TEXTUALES<\u002Fp>\n    <h2 style=\"font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: -0.015em; margin: 0 0 30px; color: var(--rooc-blue-700);\">Brecha entre discurso y práctica<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 36px;\">\n      <blockquote style=\"margin: 0; padding-left: 20px; border-left: 3px solid var(--rooc-burgundy); font-size: 15px; line-height: 1.6; color: var(--fg); text-wrap: pretty;\">Quizá la idea de que tenemos la indicación de tomar tiempo para comer o para descansar mentalmente durante la jornada, pero todo el equipo decide no hacerlo: Promotores, Cordinación operativa y Equipo estratégico, la palabra mueve pero el ejemplo arrastra<\u002Fblockquote>\n      <blockquote style=\"margin: 0; padding-left: 20px; border-left: 3px solid var(--rooc-burgundy); font-size: 15px; line-height: 1.6; color: var(--fg); text-wrap: pretty;\">Que no hay horarios establecidos o una separación real trabajo/casa, debemos estar siempre atentos por si existe algún bomberazo o la necesidad de contestar rápido. Y las actividades siempre se traslapan, no hay descansos e incluso cuando parece que los abra, algo nuevo sucede.<\u002Fblockquote>\n      <blockquote style=\"margin: 0; padding-left: 20px; border-left: 3px solid var(--rooc-burgundy); font-size: 15px; line-height: 1.6; color: var(--fg); text-wrap: pretty;\">Los mensajes de jóvenes o cordinación después de que ya salí de la sede, que a veces se le carga más la mano a las personas que SI trabajan para no tener que lidiar con las que NO trabajan.<\u002Fblockquote>\n      <blockquote style=\"margin: 0; padding-left: 20px; border-left: 3px solid var(--rooc-burgundy); font-size: 15px; line-height: 1.6; color: var(--fg); text-wrap: pretty;\">Las exigencias para llegar a las metas, el tiempo de traslado al centro, el agotamiento, el discurso de “el tiempo extra es lo que hace que funcione el programa”<br><br>La esperanza y promesa de que llegar el momento de relajación, pero se van sumando más actividades, termino quemado y las rutinas que hacía para desestresarme, las he dejado de hacer porque ya no tengo energía para realizarlas.<\u002Fblockquote>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section style=\"margin-top: 56px;\">\n    <p style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rooc-slate); margin: 0 0 10px;\">Pregunta abierta<\u002Fp>\n    <h2 style=\"font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: -0.015em; margin: 0 0 24px; color: var(--rooc-blue-700);\">Lo que el equipo pide llevarse de la capacitación<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;\">\n      <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 30px 32px;\">\n        <div style=\"font-family: var(--font-display); font-size: 30px; color: var(--rooc-blue-light); line-height: 1; margin-bottom: 16px;\">01<\u002Fdiv>\n        <h3 style=\"font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 12px;\">Desconexión y límites<\u002Fh3>\n        <p style=\"font-size: 14px; line-height: 1.6; color: var(--fg-muted); margin: 0;\">Cómo dejar el trabajo en el trabajo y poner límites sin miedo a represalias.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 30px 32px;\">\n        <div style=\"font-family: var(--font-display); font-size: 30px; color: var(--rooc-blue-light); line-height: 1; margin-bottom: 16px;\">02<\u002Fdiv>\n        <h3 style=\"font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 12px;\">Regulación en el momento<\u002Fh3>\n        <p style=\"font-size: 14px; line-height: 1.6; color: var(--fg-muted); margin: 0;\">Rituales concretos de cierre de jornada, manejo del estrés, “algo tipo mantra para soltar lo que no controlo”.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid var(--border); border-radius: 20px; padding: 30px 32px;\">\n        <div style=\"font-family: var(--font-display); font-size: 30px; color: var(--rooc-blue-light); line-height: 1; margin-bottom: 16px;\">03<\u002Fdiv>\n        <h3 style=\"font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: -0.01em; margin: 0 0 12px;\">Comunicación de equipo<\u002Fh3>\n        <p style=\"font-size: 14px; line-height: 1.6; color: var(--fg-muted); margin: 0;\">Asertividad, delegar y protocolos compartidos para no sobrecargar a quien sí cumple.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ verMetodologia }}\" hint-placeholder-val=\"{{ true }}\">\n  <footer style=\"margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--border); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px;\">\n    <div>\n      \n      \n    <\u002Fdiv>\n    <div>\n      \n      <ul style=\"font-size: 14px; line-height: 1.6; color: var(--fg-muted); margin: 0; padding-left: 20px; display: grid; gap: 8px;\">\n        \n        \n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;vista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Completa&quot;,&quot;Resumen ejecutivo&quot;],&quot;default&quot;:&quot;Completa&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Vista&quot;},&quot;mostrarVerbatims&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vista&quot;},&quot;mostrarMetodologia&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Vista&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const vista = this.props.vista ?? 'Completa';\n    const resumen = vista === 'Resumen ejecutivo';\n    return {\n      verDetalle: !resumen,\n      verVerbatims: (this.props.mostrarVerbatims ?? true) && !resumen,\n      verMetodologia: this.props.mostrarMetodologia ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

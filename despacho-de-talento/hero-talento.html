<title>Fondo · Hero · Despacho de Talento · ROOC</title>
<!-- ROOC · Despacho de Talento · fondo del Hero (solo fondo; textos y botones van nativos en Wix).
     Wix: Agregar > Insertar código > Insertar HTML > Código. Estíralo a todo el ancho y alto de la sección
     y mándalo al fondo (clic derecho > Organizar > Enviar al fondo). Medidas: ver "Hero · Wix".
     Formas: pebble oficial de ROOC, 5 piezas sueltas. Colores: fill="#..." de cada <path>. -->
<style>
:root{
  --fondo:#F4EFEB;     /* mismo color que la sección en Wix */
  --ritmo:1;           /* 1 normal · 1.5 más lento · 0.7 más vivo */
  --reticula:1120px;   /* ancho del contenido de tu sitio */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--fondo)}
.lienzo{position:fixed;inset:0;pointer-events:none}
.peb{position:absolute;overflow:visible;display:block;top:50%;right:max(24px,calc((100% - var(--reticula)) / 2));height:min(78%,42vw);aspect-ratio:1;translate:0 -50%}
.peb g{transform-box:fill-box;transform-origin:50% 50%}
.ent{opacity:0;animation:entra .9s cubic-bezier(.22,1,.36,1) forwards}
.ent.d1{animation-delay:.1s}.ent.d2{animation-delay:.18s}.ent.d3{animation-delay:.26s}.ent.d4{animation-delay:.34s}
.f1{animation:f1 calc(13s * var(--ritmo)) cubic-bezier(.65,0,.35,1) infinite alternate}
.f2{animation:f2 calc(9s * var(--ritmo)) cubic-bezier(.65,0,.35,1) -2s infinite alternate}
.f3{animation:f3 calc(10s * var(--ritmo)) cubic-bezier(.65,0,.35,1) -4s infinite alternate}
.f4{animation:f4 calc(7s * var(--ritmo)) cubic-bezier(.65,0,.35,1) -1s infinite alternate}
.f5{animation:f5 calc(5.5s * var(--ritmo)) cubic-bezier(.65,0,.35,1) -3s infinite alternate}
@media (max-aspect-ratio:1/1){
  .peb{top:24px;right:16px;height:auto;width:min(48%,210px);translate:none}
}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes f1{from{transform:translate(0,0) rotate(0deg) scale(1)}to{transform:translate(-2%,2.5%) rotate(-4deg) scale(1.02)}}
@keyframes f2{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(10%,-8%) rotate(10deg)}}
@keyframes f3{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(-8%,10%) rotate(-9deg)}}
@keyframes f4{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(14%,-12%) rotate(14deg)}}
@keyframes f5{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(-22%,18%) rotate(-20deg)}}
@media (prefers-reduced-motion:reduce){.f1,.f2,.f3,.f4,.f5{animation:none}.ent{animation:none;opacity:1}}
</style>
</head>
